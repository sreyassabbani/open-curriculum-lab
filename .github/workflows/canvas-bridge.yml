name: Canvas bridge

on:
  pull_request:
    paths:
      - "canvas_bridge/**"
      - "tests/test_canvas_bridge.py"
      - ".github/workflows/canvas-bridge.yml"
  push:
    branches: [canvas-mcp-bridge]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r canvas_bridge/requirements.txt
      - run: python -m unittest discover -s tests -p test_canvas_bridge.py -v
      - run: docker build --file canvas_bridge/Dockerfile .
